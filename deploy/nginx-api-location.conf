# Star API — proxy /api/ to the local ThreadingHTTPServer on 127.0.0.1:9001.
#
# Install: copy into the TLS server block of
# /etc/nginx/sites-enabled/star.panupong.net, above `location / { … }`, or
#   include /var/www/star/deploy/nginx-api-location.conf;
# then `nginx -t && systemctl reload nginx`.
#
# Basic Auth is declared here on purpose: on this site auth_basic lives inside
# `location / { … }`, so a new prefix location does NOT inherit it. The realm
# and password file below must stay identical to the main site's, otherwise
# the API becomes an unauthenticated hole next to an authenticated site.
#
# The webhook on 127.0.0.1:9000 (location = /webhook) is untouched by this.

location /api/ {
    auth_basic "SparkArt — Authorized Personnel Only";
    auth_basic_user_file /var/www/star/.htpasswd;

    proxy_pass http://127.0.0.1:9001;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin            $http_origin;

    # Credentials stop at nginx; the API is loopback-only and never sees them.
    proxy_set_header Authorization "";

    proxy_connect_timeout 5s;
    proxy_read_timeout    30s;
    proxy_send_timeout    30s;

    # 256KB body cap in the API; reject bigger payloads before they reach it.
    client_max_body_size 256k;

    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
